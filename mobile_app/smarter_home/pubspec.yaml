name: smarter_home
description: SmarterHome mobile app — control your smart home via AWS IoT Core.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # MQTT client (connects to AWS IoT Core via WebSocket)
  mqtt_client: ^10.0.0

  # AWS Cognito authentication
  amazon_cognito_identity_dart_2: ^3.0.0

  # Secure storage for tokens and credentials
  flutter_secure_storage: ^9.0.0

  # Local notifications (doorbell, gas alerts)
  flutter_local_notifications: ^17.0.0

  # State management
  provider: ^6.1.0

  # JSON serialization
  json_annotation: ^4.9.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/
