# Mosquitto MQTT Broker — SmarterHome Hub
# Place this file at: /etc/mosquitto/conf.d/smarthome.conf

# Local listener for ESP32 nodes (no TLS on LAN — trusted network)
listener 1883
allow_anonymous true

# Optional: restrict to your home subnet only
# bind_address 192.168.1.100

# Persistence
persistence true
persistence_location /var/lib/mosquitto/

# Logging
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Connection limits
max_connections 20
