# Mosquitto MQTT Broker — SmarterHome Hub
# Place this file at: /etc/mosquitto/conf.d/smarthome.conf

# Local listener for ESP32 nodes
listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd

# Restrict to your home subnet only — replace with your RPi's actual IP
# bind_address 192.168.1.100

# To create credentials:
#   sudo mosquitto_passwd -c /etc/mosquitto/passwd smarthome
# Then update MQTT_USER / MQTT_PASSWORD in firmware/lib/smarthome/smarthome.h

# Persistence
persistence true
persistence_location /var/lib/mosquitto/

# Logging
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Connection limits
max_connections 20
