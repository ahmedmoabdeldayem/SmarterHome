name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  hub:
    name: Hub C++ Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev

      - name: Configure
        working-directory: hub
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DBUILD_AUTOMATION=OFF

      - name: Build
        working-directory: hub
        run: cmake --build build --parallel $(nproc) --target test_rules

      - name: Run tests
        working-directory: hub/build
        run: ctest --output-on-failure

  firmware:
    name: Firmware Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Create secrets.h for CI build
        run: cp firmware/lib/smarthome/secrets.h.template firmware/lib/smarthome/secrets.h

      - name: Compile all nodes
        working-directory: firmware
        run: pio run
