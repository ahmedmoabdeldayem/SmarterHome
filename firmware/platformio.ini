; SmarterHome — Unified PlatformIO project
; Builds a separate .bin image for each ESP32 node.
;
; Commands:
;   pio run                                    → compile all 4 nodes
;   pio run -e living_room                     → compile one node
;   pio run -e living_room --target upload     → compile + flash living room ESP32
;   pio run -e bedroom     --target upload     → compile + flash bedroom ESP32
;   pio run -e kitchen     --target upload     → compile + flash kitchen ESP32
;   pio run -e entrance    --target upload     → compile + flash entrance ESP32
;   pio device monitor -e living_room          → open serial monitor for a node

; ── Shared defaults ────────────────────────────────────────────────────────────
[env]
platform       = espressif32
board          = esp32dev
framework      = arduino
monitor_speed  = 115200
lib_extra_dirs = lib

; ── Living Room ────────────────────────────────────────────────────────────────
[env:living_room]
src_dir  = src/living_room
lib_deps =
    knolleary/PubSubClient@^2.8
    crankyoldgit/IRremoteESP8266@^2.8.6
    bblanchon/ArduinoJson@^7.0.0

; ── Bedroom ────────────────────────────────────────────────────────────────────
[env:bedroom]
src_dir  = src/bedroom
lib_deps =
    knolleary/PubSubClient@^2.8
    crankyoldgit/IRremoteESP8266@^2.8.6
    bblanchon/ArduinoJson@^7.0.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; ── Kitchen ────────────────────────────────────────────────────────────────────
[env:kitchen]
src_dir  = src/kitchen
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0

; ── Entrance ───────────────────────────────────────────────────────────────────
[env:entrance]
src_dir  = src/entrance
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
